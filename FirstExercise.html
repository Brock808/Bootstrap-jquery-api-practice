<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <!-- jQuery -->
        <script src="jquery-4.0.0.min.js"></script>
        <!-- Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    </head>

    <body>
        <p class="h1 pb-2">Paragraph 1 behavior like h1</p>
        <p class="h2 pb-2">Paragraph 2 behavior like h2</p>
        <p class="h3 pb-2">Paragraph 3 behavior like h3</p>

        <div class="list-group">
            <button id="bt1" class="list-group-item list-group-item-action">Button 1</button>
    
            <button id="bt2" class="list-group-item list-group-item-action">Button 2</button>
        
            <button id="bt3" class="list-group-item list-group-item-action">Button 3</button>
        </div>
        <figure class=" w-25 h-50">
            <img 
            class="figure-img img-thumbnail"
            alt="random" 
            src="https://images.pexels.com/photos/1716861/pexels-photo-1716861.jpeg?_gl=1*y0ic79*_ga*MzgzMzgxNjk4LjE3ODY3MjQ5Mzg.*_ga_8JE65Q40S6*czE3ODkyMzU1MjAkbzYkZzEkdDE3ODkyMzU1MzkkajQxJGwwJGgw"
            >
            <figcaption class="figure-caption text-end">Hi, I am a Caption!<i class="bi bi-check2 text-success h1"></i></figcaption>
        </figure>


        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script>
            // Fixing js for the button exercices
            $(function(){
                $("#bt1, #bt2, #bt3").on("click",function(){
                    $(this).toggleClass("list-group-item-success")
                })
            })
        </script>
    </body>
</html>
